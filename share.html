<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share your location</title>
<style>
:root{--ink:#12263A;--mut:#5B6B7B;--red:#D6392B;--ok:#1F7A55;--bg:#F7F8FA}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:440px;margin:auto;padding:28px 20px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}
p{line-height:1.5;margin:0 0 16px}.mut{color:var(--mut);font-size:14px}
button{width:100%;padding:18px;font-size:19px;font-weight:600;border:0;border-radius:12px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6}button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{margin-top:18px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--red)}
</style></head><body><main>
<h1>Barangay Silang needs your location</h1>
<p>Tap the button so responders can find you. Isang pindot lang para makita ng barangay ang eksaktong lokasyon mo.</p>
<button id="go">Share my exact location</button>
<p id="msg" role="status"></p>
<p class="mut">Your location is used only for this emergency and shared only with barangay and MDRRMO staff (Data Privacy Act of 2012).</p>
</main>
<script>
var id=location.pathname.split("/").pop()||new URLSearchParams(location.search).get("t");
var $=function(i){return document.getElementById(i)},best=null,wid=null,tm=null,sent=false;
function say(t,c){$("msg").textContent=t;$("msg").className=c||""}
function post(d){d.id=id;return fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}
function stop(){navigator.geolocation.clearWatch(wid);clearTimeout(tm)}
function finish(){
 if(sent)return;stop();
 if(!best){say("No GPS signal yet. Go outside or near a window, turn on Location, and tap again.","bad");$("go").disabled=false;return}
 sent=true;
 post({lat:best.latitude,lon:best.longitude,acc:best.accuracy}).then(function(r){
  if(r.ok){say("Sent (accurate to about "+Math.round(best.accuracy)+" m). Stay where you are, help is on the way.","ok");$("go").style.display="none"}
  else{sent=false;$("go").disabled=false;say(r.status===410?"This link expired. Ask the barangay for a new one.":r.status===409?"This link was already used.":"Could not send. Tap again or tell the barangay on the phone.","bad")}
 }).catch(function(){sent=false;$("go").disabled=false;say("No internet. Tap again when connected.","bad")})}
post({action:"open"});
$("go").onclick=function(){
 if(!navigator.geolocation){say("This browser cannot share location. Open the link in Chrome or Safari.","bad");return}
 $("go").disabled=true;best=null;sent=false;say("Finding your exact location...");
 wid=navigator.geolocation.watchPosition(function(p){
  if(!best||p.coords.accuracy<best.accuracy)best=p.coords;
  say("Finding your exact location... accuracy about "+Math.round(best.accuracy)+" m");
  if(best.accuracy<=15)finish()
 },function(e){
  if(e.code===1){stop();$("go").disabled=false;say("Location is blocked. Tap Allow when asked, or turn on Location in your phone settings, then tap again.","bad")}
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 tm=setTimeout(finish,15000)};
</script></body></html>
